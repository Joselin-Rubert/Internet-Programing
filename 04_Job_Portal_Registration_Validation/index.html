<!DOCTYPE html>
<html><head><title>Job Portal Registration</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container">
<h1>Job Portal Registration</h1>
<form id="jobForm">
<input id="name" placeholder="Full Name"><span id="nameErr"></span>
<input id="email" placeholder="Email">
<input id="phone" placeholder="10-digit Phone">
<input id="password" type="password" placeholder="Password">
<select id="role"><option value="">Select Job Role</option><option>Java Developer</option><option>Web Developer</option><option>Python Developer</option></select>
<button type="submit">Register</button>
</form><p id="message"></p>
</div><script src="script.js"></script></body></html>
