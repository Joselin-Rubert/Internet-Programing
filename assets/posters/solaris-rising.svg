<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="SOLARIS RISING poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#120b04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#glow)"/>

  <circle cx="200" cy="185" r="86" fill="none" stroke="#f5c451" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="200" cy="185" r="66" fill="#000" fill-opacity="0.25"/>

  <g fill="#f5c451" fill-opacity="0.9" font-family="Segoe UI, Tahoma, sans-serif" text-anchor="middle">
    <text x="200" y="35" font-size="15" letter-spacing="7">CINEVERSE</text>
  </g>

  <text x="200" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="40" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">SOLARIS</text>
  <text x="200" y="378" font-family="Segoe UI, Tahoma, sans-serif" font-size="40" font-weight="bold"
        fill="#f5c451" text-anchor="middle" letter-spacing="2">RISING</text>

  <rect x="100" y="404" width="200" height="1.5" fill="url(#goldline)"/>

  <text x="200" y="436" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" letter-spacing="3.5"
        fill="#ffffff" fill-opacity="0.75" text-anchor="middle">SCI-FI / ADVENTURE</text>

  <g fill="#f5c451" fill-opacity="0.35">
    <rect x="60" y="530" width="280" height="1"/>
  </g>
  <text x="200" y="560" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" letter-spacing="4"
        fill="#ffffff" fill-opacity="0.4" text-anchor="middle">NOW PLAYING IN THEATRES</text>
</svg>
