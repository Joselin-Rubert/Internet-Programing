<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Online Shopping</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Smart Shop</h1><p>Online Shopping System</p></header>
<main>
<section>
<h2>Product Registration</h2>
<form>
<label>Product Search <input type="search" placeholder="Search products"></label>
<label>Email <input type="email" required></label>
<label>Quantity <input type="number" min="1" max="10"></label>
<label>Delivery Date <input type="date"></label>
<label>Product Color <input type="color"></label>
<label>Website <input type="url" placeholder="https://example.com"></label>
<button>Place Order</button>
</form>
</section>
</main>
</body></html>
