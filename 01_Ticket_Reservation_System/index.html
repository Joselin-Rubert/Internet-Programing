<!DOCTYPE html>
<html>
<head><title>Ticket Reservation System</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<h1>Ticket Reservation System</h1>
<form>
<label>Passenger Name</label><input type="text" name="name" required>
<label>From</label><input type="text" name="from" required>
<label>To</label><input type="text" name="to" required>
<label>Travel Date</label><input type="date" name="date" required>
<label>Class</label><select><option>Economy</option><option>Business</option></select>
<button type="submit">Reserve Ticket</button>
</form>
</div>
</body></html>
